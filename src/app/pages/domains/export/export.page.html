<div class="p-card p-4">
  <h1>{{ 'UI.EXPORT_DOMAIN_DATA' | translate }}</h1>
  <p>{{ 'UI.SELECT_FILTERS_AND_EXPORT_YOUR_DOMAIN_DATA_IN_THE_DESIRED_FORMAT' | translate }}</p>

  <p-messages severity="info">
    <ng-template pTemplate>
      <i class="pi pi-check-circle"></i>
      <div class="ml-2">
        {{ 'UI.WITH_DOMAIN_LOCKER_YOU_ALWAYS_OWN_YOUR_DATA_EXPORT_AT_ANYTIME_TO_MIGRATE_TO_AN_ALTERNATIVE_PLATFORM' | translate }}
      </div>
    </ng-template>
  </p-messages>

  <form [formGroup]="exportForm" (ngSubmit)="exportData()">
    <div class="flex flex-wrap gap-4 mb-4 flex-row">
      <!-- Domain input for filtering -->
      <input
        pInputText
        formControlName="domains"
        [placeholder]="'UI.DOMAIN_LEAVE_BLANK_FOR_ALL_DOMAINS' | translate"
        styleClass="w-full md:w-2/6 flex-1"
      />

      <!-- Fields to include in export -->
      <p-multiSelect
        formControlName="fields"
        [options]="availableFields"
        optionLabel="label"
        [placeholder]="'UI.SELECT_FIELDS' | translate"
        styleClass="w-full md:w-2/6 flex-1"
      ></p-multiSelect>

      <!-- Format selection -->
      <p-dropdown
        formControlName="format"
        [options]="[
          { label: 'CSV', value: 'csv' },
          { label: 'JSON', value: 'json' },
          { label: 'TXT', value: 'txt' },
        ]"
        [placeholder]="'UI.SELECT_FORMAT' | translate"
        styleClass="w-full md:w-2/6 flex-1"
      ></p-dropdown>

      <button
        pButton
        [label]="'UI.EXPORT' | translate"
        [attr.aria-label]="'UI.EXPORT' | translate"
        icon="pi pi-download"
        [disabled]="loading"
      ></button>
    </div>
  </form>

  @if (loading) {
    <p-progressSpinner class="mx-auto my-4 flex" />
  }
</div>
