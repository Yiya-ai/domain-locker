<!-- Heading and action buttons -->
<div class="flex items-center justify-between mb-4 w-full">
  <h2 class="m-0">Subdomains for {{ domain }}</h2>
  <div class="flex gap-2">
    <p-button
      [label]="'UI.REFRESH' | translate"
      icon="pi pi-refresh"
      severity="secondary"
      (click)="searchForSubdomains()"
      size="small"
    ></p-button>
    <p-button
      [label]="'UI.ADD_SUBDOMAIN' | translate"
      icon="pi pi-plus"
      size="small"
      severity="secondary"
      (click)="addSubdomainDialog.showDialog()"
    ></p-button>
    <p-button
      [label]="'UI.VIEW_PARENT_DOMAIN' | translate"
      icon="pi pi-arrow-up-right"
      severity="secondary"
      [routerLink]="['/domains', domain]"
      size="small"
    ></p-button>
  </div>
</div>

<!-- Loading spinner -->
@if (loading) {
  <p-progressSpinner class="flex mt-8" />
}

<!-- Results -->
@if (!loading && subdomains.length) {
  <app-subdomain-list [domain]="domain" [subdomains]="subdomains"></app-subdomain-list>
}

<!-- Not found message -->
@if (!loading && !subdomains.length) {
  <app-not-found
    [title]="'UI.NO_SUBDOMAINS_FOUND' | translate"
    [name]="this.domain"
    message="either doesn't exist or hasn't yet got any associated subdomains"
    [actionLink]="false"
  >
    @if (validDomain) {
      <p-button
        [label]="'UI.SEARCH_FOR_SUBDOMAINS' | translate"
        icon="pi pi-search"
        class="p-button-secondary mt-4"
        (click)="searchForSubdomains()"
      ></p-button>
    }
  </app-not-found>
}

<!-- Add new subdomain dialog -->
<app-add-subdomain-dialog #addSubdomainDialog [domain]="domain" />
