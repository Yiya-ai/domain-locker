<div class="mt-2 mb-4 flex justify-between align-items-center">
  <h1 class="m-0">{{ 'UI.TAGS' | translate }}</h1>
  <p-button (onClick)="showAddTagDialog()" [label]="'UI.ADD_NEW_TAG' | translate" icon="pi pi-plus" />
</div>

<p-table [value]="tags" [loading]="loading" styleClass="p-datatable-striped">
  <ng-template pTemplate="header">
    <tr>
      <th>{{ 'UI.TAG_NAME' | translate }}</th>
      <th>{{ 'UI.DESCRIPTION' | translate }}</th>
      <th>{{ 'UI.DOMAIN_COUNT' | translate }}</th>
      <th class="text-center">{{ 'UI.ACTIONS' | translate }}</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-tag>
    <tr class="hover:bg-highlight">
      <td class="border-l-4 border-l-{{ tag.color }}-400 whitespace-nowrap">
        <a
          [routerLink]="['/assets/tags', tag.name]"
          class="text-{{
            tag.color || 'primary'
          }}-400 flex gap-1 align-items-center no-underline text-lg capitalize"
        >
          @if (tag.icon) {
            <div
              class="tag-icon larger"
              style="mask-image: url('https://api.iconify.design/{{ tag.icon }}.svg');"
            ></div>
          }
          {{ tag.name }}
        </a>
      </td>
      <td>
        <span class="italic whitespace-pre-line">{{ tag.description }}</span>
      </td>
      <td>
        {{ tag.domainCount }}
      </td>
      <td>
        <div class="flex gap-2 justify-end whitespace-nowrap">
          <a [routerLink]="'/assets/tags/' + tag.name">
            <p-button size="small" [label]="'UI.VIEW' | translate" icon="pi pi-eye" styleClass="py-2 px-2" />
          </a>
          <a [routerLink]="'/assets/tags/' + tag.name + '/edit'">
            <p-button
              size="small"
              [label]="'UI.EDIT' | translate"
              icon="pi pi-pencil"
              styleClass="py-2 px-2"
              severity="info"
            />
          </a>
          <a [routerLink]="'/assets/tags/' + tag.name + '/add-domains'">
            <p-button
              size="small"
              [label]="'UI.ADD_DOMAINS' | translate"
              icon="pi pi-check-square"
              styleClass="py-2 px-2"
              severity="success"
            />
          </a>
          <p-button
            size="small"
            [label]="'UI.DELETE' | translate"
            icon="pi pi-trash"
            styleClass="py-2 px-2"
            severity="danger"
            (onClick)="deleteTag(tag)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="'UI.CREATE_NEW_TAG' | translate"
  [modal]="true"
  [(visible)]="addTagDialogOpen"
  [style]="{ width: '50rem' }"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [maximizable]="true"
>
  <app-tag-editor [isAddNew]="true" ($afterSave)="afterAddNewTag()" />
</p-dialog>
