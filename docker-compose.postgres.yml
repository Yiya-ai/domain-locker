# Postgres setup, for existing installs and anyone who prefers Postgres.
# The updater container is no longer needed: the app schedules its own jobs,
# and job locks mean leaving it in place causes no duplicate work.
# For a new install, the single-container docker-compose.yml is simpler.

services:
  postgres:
    image: postgres:15-alpine
    container_name: domain-locker-db
    restart: unless-stopped

    # Env vars for initial DB
    environment:
      POSTGRES_DB: ${DL_PG_NAME:-domain_locker}
      POSTGRES_USER: ${DL_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DL_PG_PASSWORD:?Set the database password}

    # Host access only. The app connects over the network below, not through this
    ports:
      - "127.0.0.1:${DL_PG_HOST_PORT:-5432}:5432"

    volumes:
      # This is where the Postgres data will be stored
      - postgres_data:/var/lib/postgresql/data
      # If you want to skip the init script, you can use the SQL to seed the db
      # - ./db/schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    networks:
      - domain_locker_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DL_PG_USER:-postgres} -d ${DL_PG_NAME:-domain_locker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: domain-locker-app
    restart: unless-stopped
    # secrets: # Uncomment to use Docker secrets
    #   - dl_pg_password
    environment:
      DL_AUTH_PASSWORD: ${DL_AUTH_PASSWORD:?Set the instance login password}
      DL_ENV_TYPE: ${DL_ENV_TYPE:-selfHosted}
      # Where the postgres service above lives. Note compose also reads a .env
      # here, so don't leave a source-build one next to this file
      DL_PG_HOST: ${DL_PG_HOST:-postgres}
      DL_PG_PORT: ${DL_PG_PORT:-5432}
      DL_PG_USER: ${DL_PG_USER:-postgres}
      DL_PG_PASSWORD: ${DL_PG_PASSWORD:?Set the database password}
      DL_PG_NAME: ${DL_PG_NAME:-domain_locker}
    ports:
      - "127.0.0.1:${DL_APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - domain_locker_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: domain_locker_postgres_data
    external: false

networks:
  domain_locker_network:
    driver: bridge

